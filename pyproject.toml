[project]
name = "o2j-lab"
version = "0.1.0"
description = "Research harness for Odwolania2json: OCR / LLM / pipeline comparison on UZP data"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pypdfium2",
    "pdfplumber",
    "pydantic>=2.9",
    "PyYAML",
    "rapidfuzz",
    "typer",
    "jinja2",
    "openai",
    "Pillow",
]

[project.optional-dependencies]
lab = [
    "jiwer",
    "pandas",
    "matplotlib",
    "numpy>=2.1",
    "opencv-python-headless",
    "psutil",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
lab = "lab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/o2jcore", "src/lab"]

[tool.uv]
package = true
