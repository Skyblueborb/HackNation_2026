[project]
name = "o2j-lab"
version = "0.1.0"
description = "Research harness for Odwolania2json: OCR / LLM / pipeline comparison on UZP data"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pypdfium2",
    "pdfplumber",
    "pydantic>=2.9",
    "PyYAML",
    "rapidfuzz",
    "typer",
    "jinja2",
    "openai",
    "Pillow",
    "jiwer",
    # Document routing vectorises text with numpy, so the serve path needs it
    # too -- not just the `lab` extra.
    "numpy>=2.1",
    "pytesseract",
]

[project.optional-dependencies]
serve = ["fastapi", "uvicorn", "python-multipart", "httpx"]
gpu = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers>=5.5.4",
    "causal-conv1d==1.7.0",
    "flash-linear-attention",
]
local = ["mlx-vlm"]
lab = [
    "jiwer",
    "pandas",
    "matplotlib",
    "numpy>=2.1",
    "opencv-python-headless",
    "psutil",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
lab = "lab.cli:app"
ocr-api = "ocr_api.cli:main"
local-ai = "local_ai.cli:main"
local-llm = "local_ai.llm:main"
ocr-pdf2json = "ocr_api.pdf_to_json:main"
ocr-batch = "ocr_api.batch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/o2jcore", "src/lab", "src/ocr_common", "src/ocr_api", "src/local_ai", "backend"]

[tool.uv]
package = true

# CUDA 13.2 wheels for the L4 production box. Explicit indexes are used only
# for the packages listed in tool.uv.sources.
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "astral-cu132"
url = "https://wheels.astral.sh/simple/cu132/"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132" }]
torchvision = [{ index = "pytorch-cu132" }]
causal-conv1d = [{ index = "astral-cu132" }]

[tool.pytest.ini_options]
pythonpath = ["."]
