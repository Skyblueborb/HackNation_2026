# Pełny stos: FastAPI + SQLite (api) i zbudowany frontend za nginx-em (web).
#
#   cp .env.example .env     # ustaw API_TOKEN i API_KEY
#   docker compose up --build
#   open http://localhost:3000
#
# Baza żyje w named volume `o2j-data` pod /data/o2j.db -- nie w repo i nie
# w obrazie. Żadne dokumenty ani gold JSON nie są kopiowane do obrazu;
# dane montuje się w runtime (patrz `volumes` niżej).
#
# Domyślnie LLM jest WYŁĄCZONY (OCR_LLM_PROCESSOR puste), więc /api/analyze
# zwraca sam tekst dokumentu. Żeby włączyć ekstrakcję JSON, uruchom serwer
# llama.cpp osiągalny z kontenera i ustaw OCR_LLM_PROCESSOR + OCR_LLM_MODEL
# w .env (na Macu/Windowsie: base_url przez host.docker.internal).

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      API_TOKEN: ${API_TOKEN:-}
      # Tylko lokalny dev: 1 wyłącza autoryzację, gdy API_TOKEN jest puste.
      O2J_DEV_NO_AUTH: ${O2J_DEV_NO_AUTH:-}
      API_KEY: ${API_KEY:-dev-key}
      O2J_DB_PATH: /data/o2j.db
      O2J_MAX_UPLOAD_MB: ${O2J_MAX_UPLOAD_MB:-25}
      O2J_CONFIG_PATH: /app/configs
      O2J_STRICT_VALIDATION: ${O2J_STRICT_VALIDATION:-0}
      # Frontend chodzi przez nginx na porcie 3000.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      WEB_OCR_BACKEND: ${WEB_OCR_BACKEND:-text}
      OCR_LLM_PROCESSOR: ${OCR_LLM_PROCESSOR:-}
      OCR_LLM_MODEL: ${OCR_LLM_MODEL:-qwen3-8b-l4}
    volumes:
      - o2j-data:/data
    # Port wystawiony tylko lokalnie; w sieci dostęp idzie przez `web`.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      # nginx dodaje ten nagłówek do każdego /api; nie trafia do bundle'a JS.
      O2J_API_TOKEN: ${API_TOKEN:-}
    ports:
      # VM organizatora wystawia do internetu tylko 80/443/8000/8080 -> WEB_PORT=8080.
      - "${WEB_PORT:-3000}:80"
    restart: unless-stopped

  # Wsad oceniający: input/ -> output/ jednym przebiegiem, bez GUI i bez portów.
  # `network_mode: host` jest konieczny, bo LLM jest osiągalny pod
  # 127.0.0.1:8082 *hosta* (tunel SSH do serwera GPU), a nie w sieci composa.
  batch:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["batch"]
    network_mode: host
    environment:
      O2J_CONFIG_PATH: /app/configs
      OCR_LLM_PROCESSOR: ${OCR_LLM_PROCESSOR:-ocr_api.llm_processor:processor}
      OCR_LLM_MODEL: ${OCR_LLM_MODEL:-qwen3-8b-l4}
    volumes:
      - ./input:/app/input
      - ./output:/app/output
    command: ["python", "-m", "ocr_api.batch", "--input", "input", "--output", "output"]

volumes:
  o2j-data:
